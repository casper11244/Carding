[package]
name = "databsegestor"
version = "0.1.0"
edition = "2021"
description = "Gestor de tarjetas con interfaz hacker en consola"

[dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.37", features = ["full"] }
crossterm = "0.27"
colored = "2.1"
chrono = "0.4"
base64 = "0.22"
rand = "0.8"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
dead_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
unused_parens = "allow"